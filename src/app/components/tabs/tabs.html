<!-- FASE 1 - CONTENITORE PRINCIPALE DEI TAB -->
<div class="tabs-container">
  <!-- FASE 2 - PULSANTI DEI TAB -->
  <div class="tabs">
    @for (tab of tabs; track tab.title) {
      <button type="button" (click)="selectTab($index)" [class.active]="activeTab() === $index">
        {{ tab.title }}
      </button>
    }
  </div>

  <!-- FASE 3 - CONTENUTO DEL TAB ATTIVO -->
  <div class="tab-content">
    <p>{{ tabs[activeTab()].content }}</p>
  </div>
</div>
